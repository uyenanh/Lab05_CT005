<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab5_Ex3.1</title>
    <!-- Nhập phông chữ Inter chuyên nghiệp từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            line-height: 1.6;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* Thẻ thông tin sinh viên dạng thẻ nổi */
        .info-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 35px;
            font-size: 1rem;
        }

        .info-card strong {
            color: #38bdf8;
        }

        /* Các mục nội dung */
        .section-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid #334155;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .section-card:hover {
            transform: translateY(-4px);
            border-color: #38bdf8;
        }

        h2 {
            color: #f8fafc;
            font-size: 1.25rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: #38bdf8;
            border-radius: 2px;
        }

        /* Tối ưu hiển thị ảnh */
        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        /* Tối ưu khung Video 16:9 */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Chân trang */
        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nội dung thực hành Lab 05 - Tạo và quản lý nội dung số</h1>
        </header>

        <div class="info-card">
            <p><strong>Họ và Tên:</strong> Nguyễn Ngọc Uyên Anh</p>
            <p style="color: #334155;">|</p>
            <p><strong>MSSV:</strong> B2605792</p>
        </div>

        <div class="section-card">
            <h2>1. Infographic Lợi ích Công nghệ số</h2>
            <img src="Lab05_Ex2.1.jpg" alt="Infographic Công nghệ số">
        </div>

        <<div class="section-card">
    <h2>2. Video minh họa (YouTube)</h2>
    <div class="video-container">
        <iframe 
            src="https://www.youtube.com/embed/5TwM055sijY" 
            title="YouTube video player" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>
    </div>
    <!-- Nút bấm dự phòng khi video bị chặn nhúng -->
    <div style="text-align: center; margin-top: 15px;">
        <a href="https://youtu.be/5TwM055sijY" target="_blank" style="display: inline-block; padding: 10px 20px; background: #38bdf8; color: #0f172a; text-decoration: none; border-radius: 8px; font-weight: 600;">
            ▶ Xem trực tiếp video trên YouTube
        </a>
    </div>
</div>

        <footer>
            <p>© Bản quyền thuộc về Nguyễn Ngọc Uyên Anh (B2605792) — Lab 05</p>
        </footer>
    </div>

</body>
</html>
